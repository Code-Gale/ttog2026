# TomTom of Gala — Nginx site
# Frontend (Next.js): 127.0.0.1:4075
# Backend (Express):  127.0.0.1:4076
#
# 1. Replace your-domain.com with your domain
# 2. sudo cp deploy/nginx.tomtom-of-gala.conf /etc/nginx/sites-available/tomtom-of-gala
# 3. sudo ln -sf /etc/nginx/sites-available/tomtom-of-gala /etc/nginx/sites-enabled/
# 4. Issue certs (certbot) or fill in ssl_certificate paths below
# 5. sudo nginx -t && sudo systemctl reload nginx

upstream tomtom_web {
    server 127.0.0.1:4075;
    keepalive 32;
}

upstream tomtom_api {
    server 127.0.0.1:4076;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Certbot usually manages these; adjust if your paths differ
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Optional: force apex if www is used
    # if ($host = www.your-domain.com) {
    #     return 301 https://your-domain.com$request_uri;
    # }

    client_max_body_size 10m;

    # Express API
    location /api/ {
        proxy_pass http://tomtom_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Gallery uploads served by Express
    location /uploads/ {
        proxy_pass http://tomtom_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://tomtom_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
